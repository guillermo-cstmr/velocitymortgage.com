<style>
/* The line draws from the first step to the last, and each step appears as
   the line reaches it. Runs once, when the image loads. */
.draw { stroke-dasharray: 404; stroke-dashoffset: 404; animation: draw 1.9s linear 0.3s forwards; }
.step { transform-box: fill-box; transform-origin: center; opacity: 0; animation: step 0.5s cubic-bezier(0.2, 0.8, 0.3, 1.2) forwards; }
.step-1 { animation-delay: 0.2s; }
.step-2 { animation-delay: 0.85s; }
.step-3 { animation-delay: 1.5s; }
.step-4 { animation-delay: 2.1s; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes step { from { opacity: 0; transform: scale(0.55); } to { opacity: 1; transform: scale(1); } }
/* Visitors who ask for less motion see the finished drawing. */
@media (prefers-reduced-motion: reduce) {
	.draw { animation: none; stroke-dashoffset: 0; }
	.step { animation: none; opacity: 1; }
}
</style>
